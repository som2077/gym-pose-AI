name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & Buffer Safety Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (for buffer tests)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Native Patches
        run: |
          node scripts/patch-nitro-pose-gradle.cjs
          node scripts/patch-nitro-pose-runtime.cjs

      - name: TypeScript Compilation Check
        run: npm run typecheck

      - name: Run Native Pose Buffer Tests
        run: npm test
