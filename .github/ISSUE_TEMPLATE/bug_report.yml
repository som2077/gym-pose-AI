name: 🐛 Bug Report
description: Report an error, crash, or unexpected behavior in GYM Pose AI.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I start a Squat session, the app crashes / the rep counter does not increment...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the app
        2. Select 'Squats'
        3. Proceed through camera setup to workout screen
        4. Perform 1 repetition
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device Information
      description: Hardware device model, Android version, and architecture.
      placeholder: e.g. Samsung Galaxy S23, Android 14, arm64-v8a
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant adb logcat output, stack traces, or screenshots.
      render: shell
